name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Lets actions/configure-pages auto-enable Pages and switch source to
# "GitHub Actions" via the Pages API. Avoids the 404 we hit when the repo's
# Pages settings got reset (e.g. after flipping visibility).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure Pages (auto-enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
