<script>
'use strict';
// ── HARNESS ────────────────────────────────────────────────────────────────────
const out = document.getElementById('results');
let passed = 0, failed = 0, currentSuite = null;

function suite(name) {
  currentSuite = name;
  const h = document.createElement('div');
  h.className = 'suite';
  h.textContent = name;
  out.appendChild(h);
}

function test(name, fn) {
  const row = document.createElement('div');
  try {
    fn();
    row.className = 'pass';
    row.textContent = '  ✓  ' + name;
    passed++;
  } catch(e) {
    row.className = 'fail';
    row.innerHTML = '  ✗  ' + name + '<div class="info">→ ' + e.message + '</div>';
    failed++;
    console.error('[FAIL]', currentSuite, '/', name, e);
  }
  out.appendChild(row);
}

function assert(cond, msg)   { if (!cond) throw new Error(msg || 'assertion failed'); }
function eq(a, b, msg)       { if (a !== b) throw new Error((msg||'') + ` — expected "${b}", got "${a}"`); }
function notNull(v, msg)     { if (v == null) throw new Error(msg || 'expected non-null'); }

// ── STATE HELPERS ──────────────────────────────────────────────────────────────

/** Fresh state with human as given charId, AIs on the remaining chars */
function stateWith(humanChar) {
  const s = newGame();
  const aiChars = [1,2,3,4,5,6,7,8].filter(c => c !== humanChar).slice(0,3);
  return {
    ...s,
    phase: 'action', sub: 'choose', callIdx: humanChar,
    collected: false, builtCount: 0, drawOpts: [], selCards: [],
    heraldQueue: [], heraldIdx: 0, heraldAcks: [],
    players: s.players.map((p,i) => ({
      ...p, char: i===0 ? humanChar : aiChars[i-1],
      dead: false, stolenTarget: null, pendingKill: null, smithyUsed: false,
    })),
  };
}

/** Set S (the global game state used by render) and trigger render into #app */
function withState(state, fn) {
  S = state;
  render();
  fn(document.getElementById('app'));
  S = null;
}

suite('Engine — Scoring');

  const p = { city: [
    {uid:'a',id:'manor',    cost:3,color:'yellow',special:null},
    {uid:'b',id:'temple',   cost:1,color:'blue',  special:null},
    {uid:'c',id:'tavern',   cost:1,color:'green', special:null},
    {uid:'d',id:'watchtower',cost:1,color:'red',  special:null},
    {uid:'e',id:'keep',     cost:3,color:'purple',special:'keep'},
  ], hand:[] };
  eq(calcScore(p,false), 9+3, '5-color diversity');
});

  const p = { city: [
    {uid:'a',id:'manor',          cost:3,color:'yellow',special:null},
    {uid:'b',id:'temple',         cost:1,color:'blue',  special:null},
    {uid:'c',id:'tavern',         cost:1,color:'green', special:null},
    {uid:'d',id:'watchtower',     cost:1,color:'red',   special:null},
    {uid:'e',id:'school_of_magic',cost:6,color:'purple',special:'flex_color'},
  ], hand:[] };
  eq(calcScore(p,false), 12+3, 'SoM diversity');

    {uid:'b',id:'keep',        cost:3,color:'purple',special:'keep'},

suite('Engine — Assassination');

test('AI killed via pendingKill does not collect income', () => {
  let s = newGame();
  s = { ...s, players: s.players.map((p,i) => ({
    ...p, char:[1,3,5,7][i], dead:false, smithyUsed:false,
    pendingKill: i===0 ? 3 : null, stolenTarget:null,
  })) };
  const goldBefore = s.players[1].gold;
  const {state,events} = doAITurn(s,1,3);
  assert(state.players[1].dead, 'AI should be dead');
  const income = events.filter(e => e.icon==='✦'||e.icon==='🃏');
  eq(income.length, 0, 'No income events for dead AI');
  eq(state.players[1].gold, goldBefore, 'Gold unchanged');
});

test('AI killed via pendingKill does not build districts', () => {
  let s = newGame();
  s = { ...s, players: s.players.map((p,i) => ({
    ...p, char:[1,3,5,7][i], dead:false, smithyUsed:false, gold:20,
    pendingKill: i===0 ? 3 : null, stolenTarget:null,
  })) };
  const cityBefore = s.players[1].city.length;
  const {state} = doAITurn(s,1,3);
  eq(state.players[1].city.length, cityBefore, 'Dead AI does not build');
});

test('Thief does not steal from player assassinated same turn', () => {
  let s = newGame();
  s = { ...s, players: s.players.map((p,i) => ({
    ...p, char:[1,2,3,5][i], dead:false, smithyUsed:false, gold:8,
    stolenTarget: i===1 ? 3 : null,
    pendingKill:  i===0 ? 3 : null,
  })) };
  const thGold = s.players[1].gold;
  const {state,events} = applyStartOfTurn(s,3,2);
  assert(state.players[2].dead, 'Victim dead');
  const steal = events.find(e=>e.icon==='💰'&&e.text.includes('steals'));
  assert(!steal, 'No steal event on dead player');
  eq(state.players[1].gold, thGold, 'Thief gold unchanged');
});

test('Thief steals from a living target', () => {
  let s = newGame();
  s = { ...s, players: s.players.map((p,i) => ({
    ...p, char:[1,2,3,5][i], dead:false, smithyUsed:false, gold:8,
    stolenTarget: i===1 ? 3 : null, pendingKill: null,
  })) };
  const {state,events} = applyStartOfTurn(s,3,2);
  const steal = events.find(e=>e.icon==='💰'&&e.text.includes('steals'));
  assert(steal, 'Steal event present');
  eq(state.players[2].gold, 0, 'Victim loses gold');
});

suite('Engine — Warlord');

test('Cannot destroy a Keep', () => {
  let s = stateWith(8);
  s = { ...s, players: s.players.map((p,i) => i===0 ? {...p,gold:10} :
    i===1 ? {...p,city:[{uid:'k1',id:'keep',name:'Keep',cost:3,color:'purple',special:'keep'}]} : p) };
  const r = humanWarlord(s,1,'k1');
  assert(r.players[1].city.some(d=>d.uid==='k1'), 'Keep survived');
});

test('Bishop (alive) city is protected', () => {
  let s = stateWith(8);
  const church = {uid:'c1',id:'church',name:'Church',cost:2,color:'blue',special:null};
  s = { ...s, players: s.players.map((p,i) => i===0 ? {...p,gold:10} :
    i===1 ? {...p,char:5,dead:false,city:[church]} : p) };
  const r = humanWarlord(s,1,'c1');
  assert(r.players[1].city.some(d=>d.uid==='c1'), 'Church survived (Bishop alive)');
});

test('Great Wall doubles destruction cost', () => {
  let s = stateWith(8);
  const wall   = {uid:'w1',id:'great_wall',name:'Great Wall',cost:6,color:'purple',special:'great_wall'};
  const prison = {uid:'p1',id:'prison',    name:'Prison',    cost:2,color:'red',   special:null};
  s = { ...s, players: s.players.map((p,i) => i===0 ? {...p,gold:10} :
    i===1 ? {...p,city:[wall,prison]} : p) };
  const g0 = s.players[0].gold;
  const r = humanWarlord(s,1,'p1');
  eq(r.players[0].gold, g0-2, 'Great Wall: full cost 2 (not cost-1=1)');
});

suite('Integration — basic turn flow');

test('Collect gold → End Turn → advances to next character', () => {
  _applyLocalSlot = 0;
  let s = stateWith(4); // human plays King (char=4), callIdx starts at 4
  // Collect gold
  s = humanCollectGold(s);
  assert(s.collected, 'collected flag set');
  eq(s.players[0].gold, newGame().players[0].gold + 2, 'gold increased by 2');
  // End turn
  s = humanEndTurn(s);
  // callIdx should have moved past 4
  assert(s.callIdx > 4 || s.phase === 'herald', 'callIdx advanced past human char');
});

test('Draw cards → keep card → sub returns to choose', () => {
  let s = stateWith(3);
  const deckBefore = s.deck.length;
  s = humanCollectCards(s);
  eq(s.sub, 'draw_pick', 'Entered draw_pick');
  assert(s.drawOpts.length >= 1, 'drawOpts populated');
  // Keep first card
  s = humanKeepCard(s, s.drawOpts[0].uid);
  eq(s.sub, 'choose', 'Returned to choose after keep');
  eq(s.collected, true, 'collected flag set after keep');
  eq(s.players[0].hand.length, newGame().players[0].hand.length + 1, 'Hand grew by 1');
});

test('Build a district → builtCount increments, gold decreases', () => {
  let s = { ...stateWith(4), collected:true };
  const me = s.players[0];
  // Find an affordable card
  const card = me.hand.find(c => c.cost <= me.gold && !me.city.some(x=>x.id===c.id));
  if (!card) { console.info('[skip] no affordable card in hand'); return; }
  const goldBefore = me.gold;
  const cost = buildCost(me, card);
  s = humanBuild(s, card.uid);
  eq(s.builtCount, 1, 'builtCount=1 after build');
  eq(s.players[0].gold, goldBefore - cost, 'gold reduced by card cost');
  assert(!s.players[0].hand.some(c=>c.uid===card.uid), 'card removed from hand');
  assert(s.players[0].city.some(c=>c.uid===card.uid),  'card added to city');
});

test('Assassin: killing a character sets pendingKill on player', () => {
  let s = stateWith(1);
  s = humanKill(s, 5); // target Bishop
  eq(s.players[0].pendingKill, 5, 'pendingKill=5 set on assassin');
});

test('Thief: declaring theft sets stolenTarget on player', () => {
  let s = stateWith(2);
  s = humanSteal(s, 6); // target Merchant
  eq(s.players[0].stolenTarget, 6, 'stolenTarget=6 set on thief');
});

test('Magician: hand swap exchanges cards correctly', () => {
  let s = stateWith(3);
  const myHand   = s.players[0].hand.map(c=>c.uid).sort().join(',');
  const theirHand = s.players[1].hand.map(c=>c.uid).sort().join(',');
  s = humanMagSwap(s, 1);
  eq(s.players[0].hand.map(c=>c.uid).sort().join(','), theirHand, 'Got their hand');
  eq(s.players[1].hand.map(c=>c.uid).sort().join(','), myHand,   'They got mine');
});

test('Architect can build 3 districts (maxB=3)', () => {
  let s = { ...stateWith(7), collected:true, builtCount:0 };
  s = { ...s, players: s.players.map((p,i)=>i===0?{...p,gold:30}:p) };
  let built = 0;
  for (const card of s.players[0].hand.slice(0,4)) {
    if (s.builtCount >= 3) break;
    const before = s.builtCount;
    s = humanBuild(s, card.uid);
    if (s.builtCount > before) built++;
  }
  assert(built >= 1, 'Architect built at least once');
  // Building a 4th is blocked
  if (s.builtCount === 3 && s.players[0].hand.length > 0) {
    const extra = s.players[0].hand[0];
    const bc = s.builtCount;
    s = humanBuild(s, extra.uid);
    eq(s.builtCount, bc, 'Cannot build 4th district as Architect');
  }
});
