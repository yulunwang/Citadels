<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>⚜ Citadels</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"></div>

<!--
  Load order is a strict dependency chain — do not reorder.
  1. ext-api.js  — extension registry (no deps)
  2. data.js     — base game data; uses EXT._extraDistricts
  3. engine.js   — game logic; calls EXT hooks at runtime
  4. ui.js       — render functions; reads S, CHARS, CS, NET
  5. net.js      — multiplayer; captures render() from ui.js, sets _onRoundEnd
  6. lobby.js    — lobby UI; calls NET, render, game functions

  Extensions are loaded AFTER lobby.js but BEFORE the boot line.
  Each extension self-registers via EXT.register({...}).
-->
<script src="js/ext-api.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/net.js"></script>
<script src="js/lobby.js"></script>

<!-- ── Extensions ── uncomment to activate ──────────────────────────────────
<script src="extensions/dark-city/extension.js"></script>
<script src="extensions/citadels-2016/extension.js"></script>
-->

<script>
  // Boot
  renderLobby({ screen: 'home' });
</script>
</body>
</html>
